webform_securepay.admin_settings:
  path: '/admin/config/webform/securepay'
  defaults:
    _form: '\Drupal\webform_securepay\Form\WebformSecurePaySettingsForm'
    _title: 'SecurePay Settings'
  requirements:
    _permission: 'administer webform'
  options:
    _admin_route: TRUE

webform_securepay.payment_callback:
  path: '/webform/securepay/callback'
  defaults:
    _controller: '\Drupal\webform_securepay\Controller\PaymentController::callback'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE

webform_securepay.webhook:
  path: '/webform/securepay/webhook'
  defaults:
    _controller: '\Drupal\webform_securepay\Controller\PaymentController::webhook'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE

webform_securepay.test_connection:
  path: '/admin/config/webform/securepay/test'
  defaults:
    _controller: '\Drupal\webform_securepay\Controller\PaymentController::testConnection'
    _title: 'Test SecurePay Connection'
  requirements:
    _permission: 'administer webform'
  methods: [GET, POST]
  options:
    _admin_route: TRUE
    no_cache: TRUE